# Guarda la foto de cierre de cada curva en public/historico/.
#
# Es la historia que usa la comparación de curvas en pantalla. BYMA sólo
# conserva los últimos dos años de cierres y los va borrando de a un día, así
# que lo que no se guarda acá, se pierde.
#
# Corre de lunes a viernes a las 18:00 hora argentina: el feed de BYMA
# termina de publicar la rueda a las 17:20 y a esa hora el cierre ya está.
# GitHub suele largarlo con horas de demora, y de noche BYMA rota el panel a
# la sesión siguiente: si lo agarra a medias y la serie histórica todavía no
# tiene la rueda, esa curva no se guarda. Por eso hay una segunda corrida a
# la mañana siguiente, que levanta lo que faltó; lo ya guardado no se pisa.
name: Guardar cierre

on:
  schedule:
    - cron: '0 21 * * 1-5' # 21:00 UTC = 18:00 hora argentina
    - cron: '0 10 * * 2-6' # 10:00 UTC = 07:00 hora argentina, la rueda de ayer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guardar-cierre
  cancel-in-progress: false

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Primero el calendario de BYMA (src/lib/reference/calendario.json): un
      # feriado o un día sin liquidación decretado sobre la hora entra solo,
      # y la foto del día ya se arma con él. Si la página no responde, queda
      # el que había.
      - name: Traer el calendario de BYMA
        continue-on-error: true
        run: npm run refresh:calendario

      # Una curva que no se pudo guardar no hace fallar el job: sería un
      # mail de GitHub. Si la foto no aparece, lo anota el vigilante como
      # mantenimiento (BYMA guarda dos años de cierres: se puede rehacer).
      - name: Guardar la foto del día
        continue-on-error: true
        run: npm run historico:guardar

      # Aunque una curva falle, lo que se guardó de las otras se sube.
      - name: Subir si hay algo nuevo
        if: always()
        run: |
          git config user.name 'LautaroToscano'
          # Dirección privada de GitHub: los commits quedan a nombre del usuario
          # sin exponer su mail en el historial público.
          git config user.email '94261012+LautaroToscano@users.noreply.github.com'
          # El calendario se sube sólo si cambió alguna fecha: el generatedAt
          # cambia en cada corrida y no es un cambio.
          cal=src/lib/reference/calendario.json
          if git diff -U0 -- "$cal" | grep -E '^[+-] ' | grep -qv generatedAt; then
            git add "$cal"
            git commit -m "Calendario de BYMA actualizado" -m "$(git diff --cached -U0 -- "$cal" | grep -E '^[+-] ' | grep -v generatedAt)"
          else
            git checkout -- "$cal" 2>/dev/null || true
          fi
          if [ -z "$(git status --porcelain -- public/historico)" ]; then
            echo "Sin fotos nuevas."
            git log origin/main..HEAD --oneline | grep -q . && { git pull --rebase --quiet origin main; git push; }
            exit 0
          fi
          git add public/historico
          # La fecha del título es la de la rueda guardada, no la del reloj.
          ruedas=$(git status --porcelain -- public/historico | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | paste -sd ' ' -)
          git commit -m "Foto de cierre del ${ruedas:-$(date -u +%Y-%m-%d)}"
          # Otro proceso pudo haber subido mientras éste corría.
          git pull --rebase --quiet origin main
          git push
