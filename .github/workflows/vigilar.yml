# Vigila el sitio publicado (scripts/vigilar.ts): que cada curva responda
# completa y al día, que carguen las páginas, el breakeven y la foto diaria.
#
# Guardia continua sin servicios externos. GitHub no garantiza los horarios
# programados (con un cron de media hora, el 15/10/2026 corrió 5 veces en 20
# horas), así que cada corrida se queda de guardia 5 h 30 min revisando cada
# 10 minutos (scripts/vigilar-turno.sh). El cron de cada hora sólo asegura
# que haya siempre una corrida en espera: cuando termina la guardia, la
# siguiente arranca en el acto. En un repo público estos minutos no se
# cobran.
#
# El aviso es un issue, no un job fallado (ver vigilar-turno.sh). Si el
# vigilante mismo no puede correr, el job falla y GitHub avisa por la vía
# de siempre.
name: Vigilar producción

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      base:
        description: 'Dirección a vigilar (vacío = producción). Sirve para probar el aviso.'
        required: false
        default: ''
      duracion:
        description: 'Minutos de guardia (0 = una sola revisión).'
        required: false
        default: '0'

permissions:
  contents: read
  issues: write

# Una sola guardia a la vez; la próxima espera su turno. Si se juntan
# varias en espera, GitHub deja sólo la más nueva. Las corridas a mano van
# por su propia fila, para no esperar detrás de una guardia.
concurrency:
  group: vigilar-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    # Una guardia de 5 h 30 min, con margen dentro del límite de 6 h.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Guardia
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
          DURACION_MIN: ${{ github.event_name == 'schedule' && '330' || inputs.duracion }}
          INTERVALO_MIN: '10'
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/vigilar-turno.sh
